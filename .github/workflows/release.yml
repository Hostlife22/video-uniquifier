name: Reels Windows diagnostics
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Immutable diagnostic source SHA
        required: true
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install ffmpeg
        run: choco install ffmpeg --yes --no-progress
      - name: Install identical CI dependency closure
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-lock.txt
          pip install -e '.[dev,gui,web]' --no-deps
      - name: Isolated real desktop delivery
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          python -X faulthandler -m pytest
          tests/unit/test_gui_reels.py::test_desktop_real_preflight_sample_and_full_export
          -s -vv -o faulthandler_timeout=120 -o faulthandler_exit_on_timeout=true
      - name: Full integration context with native watchdog
        timeout-minutes: 20
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          python -X faulthandler -m pytest -m integration -s -vv --durations=20
          -o faulthandler_timeout=180 -o faulthandler_exit_on_timeout=true

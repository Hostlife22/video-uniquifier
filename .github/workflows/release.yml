name: Ubuntu Qt native coverage diagnostics
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Immutable diagnostic source SHA
        required: true
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install native tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gdb ffmpeg libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 libxcb-xfixes0 libxcb-xkb1
      - name: Install identical CI dependency closure
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-lock.txt
          pip install -e '.[dev,gui,web]' --no-deps
      - name: Repeat full coverage under native debugger
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          for attempt in 1 2 3; do
            echo "Coverage repetition $attempt"
            gdb --return-child-result --batch -ex 'set pagination off' -ex 'run' -ex 'thread apply all bt' --args python -X faulthandler -m pytest -vv -m 'not integration and not visual' --cov=video_uniquifier.core --cov-report=term --cov-fail-under=80 || exit $?
          done

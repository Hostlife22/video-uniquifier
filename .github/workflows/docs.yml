# Build + publish the mkdocs-material site to GitHub Pages on tag
# release (v0.9.0 R6). PR builds run --strict so a broken link or
# missing-from-nav file fails the check before merge.

name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README*.md"
      - "tools/check_docs*.py"
      - "tools/docs_hooks.py"
      - "Makefile"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
      - "pyproject.toml"
    tags:
      - "v*.*.*"
  pull_request:
    paths:
      - "docs/**"
      - "README*.md"
      - "tools/check_docs*.py"
      - "tools/docs_hooks.py"
      - "Makefile"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install docs deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs,docs-test]"
          python -m playwright install --with-deps chromium
      - name: Build site (strict)
        run: make docs-build PY=python
      - name: Check language menu and search (desktop + mobile)
        run: python tools/check_docs_browser.py --site-dir _site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    # Only deploy on tag pushes; PR + main pushes only verify the
    # build succeeds. Use the GitHub-managed pages environment so
    # repo settings own the deploy permissions, not this workflow.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

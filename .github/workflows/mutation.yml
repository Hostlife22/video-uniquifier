name: Mutation testing (weekly)

# v1.2.0 Task 27 — mutmut-driven mutation testing of core/.  Runs once
# a week (slow — full suite per surviving mutation).  The kill-rate
# floor is intentionally conservative for v1.2.0 (40%) so the workflow
# can ratchet upward in subsequent releases as the suite hardens.  The
# v1.3.0 target per the roadmap is 70%.

on:
  schedule:
    # Every Sunday at 02:00 UTC.  No business reason for that exact
    # time — just outside US/EU business hours so a long run doesn't
    # contend with on-demand CI traffic.
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      mutants:
        description: "Optional mutant pattern for a focused smoke; empty runs all core mutations"
        required: false
        default: ""

jobs:
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # full mutation pass on core/ can take 1-2h
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ffmpeg + system libs
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gui]"
      - name: Run mutmut on core/
        env:
          QT_QPA_PLATFORM: offscreen
          MUTMUT_PATTERN: ${{ inputs.mutants || '' }}
        # mutmut 3 reads source/test selection from [tool.mutmut].
        # Infrastructure and baseline failures must fail this step; surviving
        # mutants are evaluated separately by the existing 40% gate.
        run: |
          if [ -n "${MUTMUT_PATTERN}" ]; then
            mutmut run "${MUTMUT_PATTERN}"
          else
            mutmut run
          fi
          mutmut export-cicd-stats
      - name: Compute kill rate and gate at 40%
        run: |
          python <<'PY'
          import json, sys
          from pathlib import Path
          stats = json.loads(Path("mutants/mutmut-cicd-stats.json").read_text())
          killed = stats["killed"]
          survived = stats["survived"]
          total = killed + survived
          if total == 0:
              print("No completed mutations recorded — environment or baseline failure")
              sys.exit(1)
          rate = 100.0 * killed / total
          print(f"Mutation kill rate: {killed}/{total} = {rate:.1f}%")
          if rate < 40.0:
              print("Below v1.2.0 floor (40%) — fail the workflow")
              sys.exit(1)
          PY

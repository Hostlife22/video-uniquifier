# Build all three languages: make docs-build
# English lives at /; Russian at /ru/; Simplified Chinese at /zh/.
# Retain Unicode tokens; the client multi-language trimmer drops CJK.
# Chinese word boundaries are provided by jieba at build time.
site_name: video-uniquifier
site_description: 'Production-grade re-encoder with controlled micro-transforms for owned/licensed video
  content. Re-upload your own work; never evade rights-holder detection.

  '
site_url: https://hostlife22.github.io/video-uniquifier/
repo_url: https://github.com/Hostlife22/video-uniquifier
repo_name: Hostlife22/video-uniquifier
edit_uri: edit/main/docs/
strict: true
theme:
  name: material
  features:
  - navigation.tracking
  - navigation.expand
  - navigation.top
  - search.suggest
  - search.highlight
  - content.code.copy
  - content.action.edit
  palette:
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: indigo
    accent: indigo
    toggle:
      icon: material/weather-sunny
      name: Switch to light mode
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: indigo
    accent: indigo
    toggle:
      icon: material/weather-night
      name: Switch to dark mode
  language: en
nav:
- Home: index.md
- Getting started: getting-started.md
- Install: install.md
- GUI walkthrough: gui-walkthrough.md
- Video delivery / Reels:
  - User guide: facebook-reels.md
  - Implementation log: facebook-reels-development.md
- Web UI & Docker: web.md
- Profiles:
  - Schema & transforms: profiles.md
  - Transform reference: transform_reference.md
  - Community marketplace: marketplace.md
  - Plugin transforms: plugins.md
- Pipeline:
  - Architecture: architecture.md
  - Filter graph: filter_graph.md
  - Seed strategy: seed_strategy.md
  - Distributed batch: distributed.md
- QA:
  - QA report: qa_report.md
  - SSCD copy detection: sscd.md
  - Corpus index: corpus.md
  - Validation harness: validation_harness.md
- Operations:
  - Calibration: calibrate.md
  - Hardware qualification: hardware_qualification.md
  - YouTube targets: youtube_targets.md
  - Telemetry: telemetry.md
  - Application localization: i18n.md
  - Documentation languages: documentation.md
- Project:
  - Versioning & compatibility: versioning.md
  - API contracts: api-contracts.md
  - Security policy: security.md
  - Accessibility: accessibility.md
- Development:
  - GUI reference: gui.md
  - UI design: ui-design.md
  - GUI sweep: gui_sweep.md
  - Manual GUI checklist: manual_gui_checklist.md
  - Scale test runbook: runbook_scale_test.md
markdown_extensions:
- admonition
- attr_list
- footnotes
- md_in_html
- tables
- toc:
    permalink: true
- pymdownx.details
- pymdownx.highlight:
    anchor_linenums: true
- pymdownx.inlinehilite
- pymdownx.snippets
- pymdownx.superfences
- pymdownx.tabbed:
    alternate_style: true
plugins:
- search:
    lang:
    - en
    separator: '[\s\u200b\-]+'
    pipeline:
    - stopWordFilter
- i18n:
    docs_structure: folder
    fallback_to_default: true
    reconfigure_material: true
    reconfigure_search: false
    languages:
    - locale: en
      default: true
      name: English
      build: true
    - locale: ru
      name: Русский
      build: true
      site_description: Обработка и перекодирование собственных и лицензированных видео.

# video-uniquifier — bounded NAS / homelab deployment template (v1.5.0).
#
# Copy this file to your NAS, edit the volume paths, then:
#   docker compose up -d
#
# Auth is OFF by default because the host port is loopback-only. Keep this
# boundary and expose it through a TLS reverse proxy. Basic Auth alone does not
# encrypt credentials; never publish the container directly on an untrusted LAN.

services:
  video-uniquifier:
    image: "video-uniquifier:${VIDEO_UNIQ_IMAGE_TAG:-2.1.0}"
    # Use ``build: .`` instead when iterating locally on the
    # Dockerfile. The published image lives at the tag you push to.
    # build: .
    restart: unless-stopped
    # Hard container ceilings complement the application's run/encoder
    # admission controls. Tune explicitly for the deployment host.
    cpus: "${VIDEO_UNIQ_CPU_LIMIT:-4.0}"
    # Natural 1080p60 HDR/VMAF qualification peaked near 8.8 GiB RSS on
    # Intel macOS; 12 GiB avoids making the documented default self-OOM.
    mem_limit: "${VIDEO_UNIQ_MEMORY_LIMIT:-12g}"
    pids_limit: ${VIDEO_UNIQ_PIDS_LIMIT:-512}
    ports:
      - "127.0.0.1:8080:8080"   # bind to loopback by default; reverse-
                                # proxy via nginx/traefik for TLS + LAN
    environment:
      VIDEO_UNIQ_WEB_HOST: "0.0.0.0"
      VIDEO_UNIQ_WEB_PORT: "8080"
      VIDEO_UNIQ_WEB_INPUT_ROOT: "/data/input"
      VIDEO_UNIQ_WEB_OUTPUT_DIR: "/data/output"
      VIDEO_UNIQ_WEB_WORK_DIR: "/data/work"
      VIDEO_UNIQ_WEB_PROFILE_DIR: "/data/profiles"
      VIDEO_UNIQ_WEB_MAX_CONCURRENT_RUNS: "${VIDEO_UNIQ_MAX_CONCURRENT_RUNS:-2}"
      # Uncomment to enable basic auth.
      # VIDEO_UNIQ_WEB_USER: "${WEB_USER:-changeme}"
      # VIDEO_UNIQ_WEB_PASS: "${WEB_PASS:-changeme}"
    volumes:
      - ./input:/data/input:ro
      - ./output:/data/output
      - ./work:/data/work
      - ./profiles:/data/profiles
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent",
             "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
